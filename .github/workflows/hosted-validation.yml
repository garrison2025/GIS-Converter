name: GIS Converter hosted build and GDAL test (no deploy)
on:
  push:
    branches: ['dev/**', main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  astro-and-gdal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Install audited lockfile deterministically with npm ci
        run: npm ci --no-audit --no-fund
      - name: Independently test bounded GIS structural quality report
        run: npm run smoke:quality-report
      - name: P34 validate free mini-batch ZIP safety limits and per-file report manifest
        run: npm run smoke:mini-batch-unit
      - name: P35 verify bounded WGS84 output vector sample, polygon holes and CRS rejection
        run: npm run smoke:preview-unit
      - name: P36 reject false CSV zero coordinates and verify SHP Null Shape DBF row alignment
        run: npm run smoke:preview-integrity
      - name: P37 verify antimeridian-safe line/polygon/holes display with original coordinates preserved
        run: npm run smoke:antimeridian-unit
      - name: P38 verify GPX KML KMZ SHP coordinate, timestamp and polygon preview boundaries
        run: npm run smoke:preview-boundaries
      - name: P39 independently match WGS84 point coordinates and block silent interior-point loss
        run: npm run smoke:point-fidelity
      - name: Stage real GDAL/WASM and record SHA256 and sizes
        run: npm run stage:gdal
      - name: Gzip oversized GDAL asset and measure actual compressed file
        run: npm run pack:gdal
      - name: Compile actual Astro project
        run: npm run build
      - name: Install Chromium Firefox and WebKit for real browser and GIS conversion tests
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Probe independent cancellable classic Worker running real GDAL
        run: node scripts/isolated-worker-probe.mjs
      - name: Reject hostile GIS archives before loading WebAssembly
        run: npm run smoke:input-security
      - name: Recheck known real GDAL KML to GeoJSON
        run: npm run smoke:browser
      - name: Run all 19 real GDAL route fixtures
        run: npm run smoke:matrix
      - name: Verify polygon topology Unicode encoding and EPSG reprojection
        run: npm run smoke:gis-quality
      - name: Stress-test 12000 GIS features and independently inspect SHP records
        run: npm run smoke:gis-stress
      - name: Stress-test 3000 polygons with holes, UTF-8 DBF, field truncation, and Chromium RSS sampling
        run: npm run smoke:polygon-stress
      - name: P29 verify complex GIS uploads downloads projection and real GPS fidelity in Chromium
        run: npm run smoke:complex-local
      - name: Validate 19 Astro tool links and three real UI downloads
        run: npm run smoke:ui
      - name: Verify 19 routes through real isolated Worker upload and download
        run: npm run smoke:all-ui
      - name: P31 verify mobile width keyboard navigation stale output Blob cleanup and retry
        run: npm run smoke:mobile-local
      - name: P34 verify free 3-file browser batch ZIP in Chromium Firefox WebKit, drag-drop and atomic cancellation
        run: npm run smoke:mini-batch-local
      - name: P35 real Chromium Firefox WebKit preview of converted SHP KML KMZ GPX CSV and batch
        run: npm run smoke:preview-local
      - name: Verify hard cancel, timeout, retry and worker termination
        run: npm run smoke:cancel
      - name: Real browser GDAL test using only gzip-encoded WASM response
        run: npm run smoke:compressed
      - name: Prepare Pages package (strip raw oversized WASM)
        run: npm run prepare:pages
      - name: Independently verify commit-attested Pages bundle and prelaunch SEO protection
        run: npm run smoke:release
      - name: Audit 19 GIS SEO pages for distinct practical guidance and original FAQs
        run: npm run smoke:seo-prelaunch
      - name: Verify release checker rejects stale SHA and Cloudflare HTML fallback over real HTTP
        run: npm run smoke:live-loopback
      - name: Verify Pages Function in local Wrangler runtime with real GDAL/WASM
        run: npm run smoke:wrangler
      - name: P32 verify real Firefox WebKit and Chromium conversions using compressed Pages WASM
        run: npm run smoke:crossbrowser-local
      - name: Verify short Cloudflare build command is configured
        run: node --input-type=module -e "import pkg from './package.json' with {type:'json'}; if (!pkg.scripts['build:pages']?.includes('prepare:pages')) process.exit(1)"
      - name: Save evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gis-hosted-validation-evidence
          path: |
            site/isolated-worker-probe.json
            site/gdal-browser-result.json
            site/gdal-runtime-report.json
            site/gdal-gzip-report.json
            site/gdal-route-matrix.json
            site/astro-tool-ui-result.json
            site/p31-mobile-local-results.json
            site/p34-mini-batch-local-results.json
            site/p35-preview-local-results.json
            site/gis-quality-results.json
            site/live-matrix-report.json
            site/all-ui-gate-error.txt
            site/gis-stress-results.json
            site/gis-polygon-stress.json
            site/p29-complex-local-results.json
            site/task-lifecycle-result.json
            site/input-preflight-results.json
            site/compressed-gdal-browser-result.json
            site/pages-preview-package-report.json
            site/p27-static-release-gate.json
            site/p28-seo-prelaunch-audit.json
            site/p27-live-loopback-results.json
            site/dist/release.json
            site/wrangler-pages-result.json
            site/p32-wrangler-preflight.json
            site/p32-crossbrowser-local-results.json
            site/package-lock.json
          if-no-files-found: warn
  native-ogr-desktop:
    name: P33 independent native GDAL/OGR desktop-reader compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 24
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Install native desktop GDAL utilities, not the website GDAL WASM runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gdal-bin
          ogrinfo --version
          ogr2ogr --version
      - name: Install locked site and Chromium browser dependencies
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build real Cloudflare Pages gzip-function artifact in noindex preview mode
        run: npm run build:pages
      - name: Native OGR independently read six browser downloads and generate projected SHP input
        run: npm run smoke:native-local
      - name: Preserve native desktop GIS interoperability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gis-p33-native-ogr-desktop-compatibility
          path: |
            site/p33-native-local-preflight.json
            site/p33-native-local-results.json
            site/dist/release.json
          if-no-files-found: warn
  seo-activation-dry-run:
    name: P30 isolated custom-domain SEO build rehearsal (never deployed)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Install pinned dependencies for offline production SEO build
        run: npm ci --no-audit --no-fund
      - name: Parse manual future real-domain verifier without contacting any domain
        run: node --check scripts/p30-live-seo-acceptance.mjs
      - name: Build isolated SEO launch package using only the reserved .example domain
        run: npm run build:pages
        env:
          GIS_SEO_LAUNCH: approved
          GIS_PUBLIC_ORIGIN: https://gis-launch.example
          GIS_SEO_TEST_MODE: '1'
      - name: Verify 20 production canonical URLs, XML sitemap, host-specific noindex and fail-closed conditions
        run: npm run smoke:seo-rehearsal
        env:
          GIS_SEO_LAUNCH: approved
          GIS_PUBLIC_ORIGIN: https://gis-launch.example
          GIS_SEO_TEST_MODE: '1'
      - name: Store non-deployed SEO launch test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gis-p30-isolated-seo-launch-test
          path: |
            site/p30-seo-production-rehearsal.json
            site/pages-preview-package-report.json
            site/dist/release.json
          if-no-files-found: warn
  billing-ledger-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Test D1-style billing logic without external payment calls
        run: node --experimental-sqlite billing/tests/test_d1_adapter.mjs
