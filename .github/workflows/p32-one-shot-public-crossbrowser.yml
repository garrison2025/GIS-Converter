name: GIS Converter P32 public Chromium Firefox WebKit browser acceptance (read-only)
on:
  push:
    branches: [main]
    paths:
      - site/.p32-public-crossbrowser-acceptance
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p32-public-crossbrowser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: site
    env:
      GIS_BASE_URL: https://gis-converter.pages.dev
      GIS_EXPECTED_COMMIT: ${{ github.sha }}
      GIS_EXPECTED_BRANCH: main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Wait for exact merged P32 main SHA on real public Cloudflare Pages
        run: node scripts/p32-await-live-release.mjs
      - name: Install pinned GIS browser QA dependencies
        run: npm ci --no-audit --no-fund
      - name: Check public release identity and noindex preview policy
        run: npm run smoke:live-release
      - name: Install Chromium Firefox and WebKit for independent public GIS tests
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Test real Cloudflare Page browser GIS uploads exports downloads and recovery in 3 browser engines
        run: npm run smoke:crossbrowser-live
      - name: Recheck all 19 real public GIS route uploads and downloads
        run: node scripts/live-all-routes.mjs
      - name: Preserve public three-engine GIS browser evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gis-p32-public-crossbrowser-evidence
          path: |
            site/p32-live-deployment-wait.json
            site/live-release-gate.json
            site/p32-crossbrowser-live-results.json
            site/live-matrix-report.json
          if-no-files-found: warn
# All operations are read-only browser GIS tests. No Cloudflare account, DNS, payment, or indexing changes.
