name: GIS Converter P52 CI stability and full public GIS acceptance
on:
  push:
    branches: [main]
    paths:
      - site/.p52-ci-stability-public-acceptance
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gis-p52-public-${{ github.ref }}
  cancel-in-progress: false
jobs:
  p52-public-acceptance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: site
    env:
      GIS_BASE_URL: https://gis-converter.pages.dev
      GIS_EXPECTED_COMMIT: ${{ github.sha }}
      GIS_EXPECTED_BRANCH: main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Verify deployed Cloudflare SHA equals merged main
        run: node scripts/p35-await-live-release.mjs
      - name: Install exact npm dependency lockfile
        run: npm ci --no-audit --no-fund
      - name: Restore version-pinned Chromium Firefox WebKit cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: gis-pw-all-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-v1.57.0
      - name: Install and verify complete three-engine Playwright support
        run: timeout 1500s npx playwright install --with-deps chromium firefox webkit
      - name: Assert P52 host CI and public browser coverage policy
        run: npm run smoke:ci-policy
      - name: Verify P50 named point attributes and critical DATA_LOSS gate
        run: npm run smoke:cross-attributes
      - name: Verify P51 geometry-associated attributes and swapped fields
        run: npm run smoke:complex-attributes
      - name: Validate release provenance and preview noindex for all 19 routes
        run: npm run smoke:live-release
      - name: Recheck nine real public GDAL complex feature attribute cases
        run: npm run smoke:complex-attr-browser
      - name: Recheck all 19 public GDAL browser upload/download routes
        run: node scripts/live-all-routes.mjs
      - name: Recheck 19 previews including actual Chromium Firefox WebKit
        run: npm run smoke:preview-live
      - name: Preserve sanitized audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gis-p52-public-ci-quality
          path: |
            site/p35-live-deployment-wait.json
            site/live-release-gate.json
            site/p51-complex-attribute-browser-public.json
            site/live-matrix-report.json
            site/p35-preview-live-results.json
          if-no-files-found: warn
# Engineering preview only; no production SEO, billing or file uploads to a backend.
