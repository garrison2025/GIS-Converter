name: GIS Converter P42 constrained devices and native GIS interoperability (read-only)
on:
  push:
    branches: [main]
    paths:
      - site/.p42-constrained-gis-public-acceptance
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p42-public-memory-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    defaults:
      run:
        working-directory: site
    env:
      GIS_BASE_URL: https://gis-converter.pages.dev
      GIS_EXPECTED_COMMIT: ${{ github.sha }}
      GIS_EXPECTED_BRANCH: main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Wait for exact merged P42 Cloudflare SHA
        run: node scripts/p35-await-live-release.mjs
      - name: Install locked site Chromium Firefox WebKit and native GDAL/OGR
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium firefox webkit
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin
      - name: Validate P42 resource-budget unit and ZIP memory guards
        run: npm run smoke:memory-policy
      - name: Verify exact release SHA and engineering-preview noindex
        run: npm run smoke:live-release
      - name: Run P42 18 real-browser GIS preview, low-memory and retry cases
        run: npm run smoke:preview-live
      - name: Native GDAL/OGR independently validate seven interoperability cases including CP1252
        run: npm run smoke:native-live
      - name: Verify all 19 real GIS upload/download routes
        run: node scripts/live-all-routes.mjs
      - name: Preserve P42 exact-release memory/interoperability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gis-p42-public-memory-interoperability-evidence
          path: |
            site/p35-live-deployment-wait.json
            site/live-release-gate.json
            site/p35-preview-live-results.json
            site/p33-native-live-results.json
            site/live-matrix-report.json
          if-no-files-found: warn
# Browser-local processing only. No remote GIS uploads, payment or SEO activation.
