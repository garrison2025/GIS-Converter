name: GIS Converter P50 cross-format attributes public acceptance
on:
  push:
    branches: [main]
    paths:
      - site/.p50-cross-format-public-acceptance
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p50-public-cross-attributes:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: site
    env:
      GIS_BASE_URL: https://gis-converter.pages.dev
      GIS_EXPECTED_COMMIT: ${{ github.sha }}
      GIS_EXPECTED_BRANCH: main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Verify Cloudflare serves the exact merged P50 main SHA
        run: node scripts/p35-await-live-release.mjs
      - name: Install locked site dependencies
        run: npm ci --no-audit --no-fund
      - name: Reuse compatible Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: gis-pw-all-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-v1.57.0
      - name: Install and validate full Chromium Firefox WebKit suite
        run: timeout 1500s npx playwright install --with-deps chromium firefox webkit
      - name: P49 DBF typed/null semantic regression
        run: npm run smoke:dbf-semantics
      - name: P50 independent CSV KML KMZ GeoJSON attribute mismatch and loss gates
        run: npm run smoke:cross-attributes
      - name: Public 19-route release and noindex verification
        run: npm run smoke:live-release
      - name: P50 run six actual public browser GDAL attribute conversions
        run: npm run smoke:cross-browser
      - name: Check 19 real public GIS upload/download routes
        run: node scripts/live-all-routes.mjs
      - name: Check 19 real public preview and quality reports
        run: npm run smoke:preview-live
      - name: Preserve sanitized acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gis-p50-public-cross-format-integrity
          path: |
            site/p35-live-deployment-wait.json
            site/live-release-gate.json
            site/p50-cross-format-browser-public.json
            site/live-matrix-report.json
            site/p35-preview-live-results.json
          if-no-files-found: warn
# Engineering preview; no payment, no SEO indexing or hosted user files.
