name: GIS Converter P48 DBF precision public acceptance
on:
  push:
    branches: [main]
    paths:
      - site/.p48-dbf-precision-public-acceptance
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p48-public-attributes:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    defaults:
      run:
        working-directory: site
    env:
      GIS_BASE_URL: https://gis-converter.pages.dev
      GIS_EXPECTED_COMMIT: ${{ github.sha }}
      GIS_EXPECTED_BRANCH: main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Wait until Cloudflare serves the exact P48 merged main SHA
        run: node scripts/p35-await-live-release.mjs
      - name: Install pinned dependencies and real browsers
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium firefox webkit
      - name: Strict UTF-8 DBF Chinese field and precision comparison unit gates
        run: npm run smoke:dbf-precision
      - name: Verify exact Cloudflare route count and engineering-preview noindex
        run: npm run smoke:live-release
      - name: Real public GDAL Unicode and high-precision attribute roundtrip
        run: npm run smoke:attribute-browser
      - name: Independently check all 19 public GIS upload and download paths
        run: node scripts/live-all-routes.mjs
      - name: Recheck 19 real GIS output previews and structural reports
        run: npm run smoke:preview-live
      - name: Save sanitized public P48 DBF precision artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gis-p48-public-attribute-integrity
          path: |
            site/p35-live-deployment-wait.json
            site/live-release-gate.json
            site/p48-attribute-browser-public.json
            site/live-matrix-report.json
            site/p35-preview-live-results.json
          if-no-files-found: warn
# No remote user file upload, billing checkout or SEO publication.
