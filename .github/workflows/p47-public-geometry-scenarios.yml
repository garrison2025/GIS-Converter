name: GIS Converter P47 complex scenario public acceptance
on:
  push:
    branches: [main]
    paths:
      - site/.p47-geometry-scenarios-public-acceptance
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p47-public-scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 44
    defaults:
      run:
        working-directory: site
    env:
      GIS_BASE_URL: https://gis-converter.pages.dev
      GIS_EXPECTED_COMMIT: ${{ github.sha }}
      GIS_EXPECTED_BRANCH: main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Wait for exact merged P47 commit on Cloudflare Pages
        run: node scripts/p35-await-live-release.mjs
      - name: Install locked site dependencies and actual browsers
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium firefox webkit
      - name: Validate exact 19 routes and deployed noindex engineering preview
        run: npm run smoke:live-release
      - name: Verify synthetic route eligibility and polygon hole/line shapefile binary records
        run: npm run smoke:scenario-unit
      - name: Run every compatible real browser GDAL/WASM geometry scenario and WebKit polygon
        run: npm run smoke:scenario-browser
      - name: Recheck all 19 standard browser GIS upload/download routes
        run: node scripts/live-all-routes.mjs
      - name: Independently validate 19 output previews and quality JSON reports
        run: npm run smoke:preview-live
      - name: Preserve public exact-SHA and synthetic scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gis-p47-public-geometry-scenarios
          path: |
            site/p35-live-deployment-wait.json
            site/live-release-gate.json
            site/p47-scenarios-public.json
            site/live-matrix-report.json
            site/p35-preview-live-results.json
          if-no-files-found: warn
# No user GIS files uploaded, paid API invoked, SEO enabled or checkout activated.
